[tool.ruff]
target-version = "py312"
line-length = 90
exclude = ["migrations/versions"]

[tool.ruff.lint]
# default rule set (E4, E7, E9, F) - correctness/pyflakes, kept deliberately
# small for now rather than opinionated style rules, to keep this baseline
# pass focused on real issues instead of a huge stylistic diff
select = ["E4", "E7", "E9", "F"]
