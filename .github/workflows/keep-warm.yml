name: keep warm

# Render's free tier spins the service down after 15 min idle, so ping
# /health every 10 min to avoid a ~1 min cold start for the next visitor.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            https://wego-ride-backend.onrender.com/health
