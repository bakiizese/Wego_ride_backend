  /api/v1/rider/pay-ride:
    post:
      summary: Initiate a Chapa payment for a booked ride
      description: Starts a Chapa hosted-checkout payment. The charge is always computed server-side from
        the trip's fare - never from the request body. The payment stays 'pending' until Chapa's webhook
        (POST /api/v1/webhooks/chapa) confirms it; this endpoint only returns a checkout_url to redirect
        the rider to.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - trip_id
              properties:
                trip_id:
                  type: string
                  example: trip_id_123
                return_url:
                  type: string
                  description: Where Chapa redirects the rider's browser after checkout. Defaults to this
                    server's /health if omitted.
                  nullable: true
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url:
                    type: string
                    example: https://checkout.chapa.co/checkout/payment/abc123
                  tx_ref:
                    type: string
                    example: wego-3f2a91b2-8a1c9d4e-1a2b3c4d
        '200':
          description: You haven't booked this ride, or have already paid for it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: you have already paid for this ride
        '404':
          description: Trip or totalpayment record not found
        '400':
          description: Validation failed (missing trip_id)
        '502':
          description: Chapa's API was unreachable or errored
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token has expired
      tags:
      - Payments
  /api/v1/rider/transactions:
    get:
      summary: Get all transactions made by rider
      description: Fetches all payment transactions associated with a rider.
      parameters:
      - name: order_by
        in: query
        required: false
        description: The column by which to order the transactions. Default is 'created_at'.
        schema:
