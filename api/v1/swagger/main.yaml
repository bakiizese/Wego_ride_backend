  /api/v1/webhooks/chapa:
    post:
      summary: Chapa payment webhook
      description: Called by Chapa's servers (not an authenticated app client) when a payment's status
        changes. Verifies the `Chapa-Signature` header against the configured webhook secret, then double-checks
        the transaction status directly against Chapa's verify-transaction API before touching anything
        - the webhook payload's own status field is never trusted on its own.
      parameters:
      - name: Chapa-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_ref:
                  type: string
                status:
                  type: string
                  example: success
      responses:
        '200':
          description: Webhook processed (payment confirmed, failed, or already processed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: payment confirmed
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: request body must be valid JSON
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized to access
        '404':
          description: Unknown tx_ref
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Resource not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: An internal error occurred
      tags:
      - Webhooks
