                        type: string
                        enum:
                        - Rider
                        - Driver
                      ratee_id:
                        type: string
                      score:
                        type: integer
                        minimum: 1
                        maximum: 5
                        example: 5
                      comment:
                        type: string
                        example: great ride
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '400':
