        '200':
          description: Vehicle found
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicle: &id002
                    type: object
                    properties:
                      id:
                        type: string
                      driver_id:
                        type: string
                      type:
                        type: string
                        example: sedan
                      model:
                        type: string
                        example: corolla
                      color:
                        type: string
                        example: white
                      seating_capacity:
                        type: integer
                        example: 4
                      plate_number:
                        type: string
                        example: AA-123-BB
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '404':
          description: No vehicle registered yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: vehicle not registered
        '401': *id001
      tags:
      - Vehicle
    post:
      summary: Register this driver's vehicle
      description: One vehicle per driver - a second attempt is rejected with 409.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - model
              - color
              - seating_capacity
              - plate_number
              properties:
                type:
                  type: string
                  example: sedan
                model:
                  type: string
                  example: corolla
                color:
                  type: string
                  example: white
                seating_capacity:
                  type: integer
                  example: 4
                plate_number:
                  type: string
                  example: AA-123-BB
                license_number:
                  type: string
                  example: LIC-001
                  nullable: true
      responses:
        '201':
          description: Vehicle registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicle: *id002
        '409':
          description: Already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: vehicle already registered for this driver
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: validation failed
        '401': *id001
      tags:
      - Vehicle
    put:
      summary: Update this driver's registered vehicle
      description: All fields optional - only the ones provided are changed.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                model:
                  type: string
                color:
                  type: string
                  example: black
                seating_capacity:
                  type: integer
                plate_number:
                  type: string
                license_number:
                  type: string
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicle:
                    type: string
                    example: updated
        '404':
          description: No vehicle registered yet
