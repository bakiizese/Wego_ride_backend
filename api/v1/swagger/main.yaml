openapi: 3.0.3
info:
  title: wego_ride
  version: '1.0'
  description: API documentation for wego_ride
servers:
- url: https://wego-ride-backend.onrender.com
  description: production
- url: http://localhost:5000
  description: local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      tags:
      - System
      summary: Liveness check
      description: Unauthenticated - used by Render's health check and any uptime monitor.
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/admin/admin-register:
    post:
      summary: Register a new admin
      description: Registers a new admin. If no Admin exists yet in the database, this bootstraps the
        very first superadmin **without requiring authentication** - admin_level is forced to "superadmin"
        regardless of what's sent, and the response includes a ready-to-use JWT so you don't need a separate
        login call. The moment one Admin exists, this goes back to requiring a valid superadmin Bearer
        token like any other admin-management endpoint, and the response no longer includes a token -
        use POST /api/v1/admin/login instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: dani
                first_name:
                  type: string
                  example: daniel
                last_name:
                  type: string
                  example: abera
                email:
                  type: string
                  format: email
                  example: admin@example.com
                phone_number:
                  type: string
                  example: '251934567890'
                password_hash:
                  type: string
                  example: secure_password_hash
                admin_level:
                  type: string
                  example: superadmin
                  description: 'Other possible values: "moderator"'
      responses:
        '201':
          description: admin registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    example: Admin Id
                  token:
                    type: string
                    description: Only present on the bootstrap call (the very first admin ever created).
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Missing required user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: username missing
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unsupported media type
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: An internal error occurred
        '403':
          description: Access not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Access not allowed
                    description: 'Other possible values: "only superadmin allowed", "Admin access required"'
        '401':
          description: Unauthorized to access
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token has expired
                    description: 'Other possible values: "Invalid Token"'
      security:
      - bearerAuth: []
      tags:
      - Auth
  /api/v1/admin/login:
    post:
      summary: admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    example: jwt generated code
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unsupported media type
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: email missing
                    description: 'Other possible values: "incorrect password"'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: An internal error occurred
      tags:
      - Auth
  /api/v1/admin/logout:
    post:
      summary: Log out and blacklist the current JWT
      description: Adds the current token to the Redis blacklist so it can no longer be used, even before
        it naturally expires.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  User:
                    type: string
                    example: Logged out
        '401': &id001
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token has expired
      tags:
      - Auth
