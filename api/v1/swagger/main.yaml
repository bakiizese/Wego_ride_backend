- name: Auth
  description: Registration, login, logout, and password reset for all three roles
- name: Admin
  description: Admin-only user, ride, and reporting management
- name: Profile
  description: Reading and updating a driver's or rider's own profile
- name: Vehicle
  description: A driver's registered vehicle
- name: Ride Management
  description: Booking, tracking, and completing rides
- name: Payments
  description: Chapa checkout, transaction history, and driver earnings
- name: Ratings
  description: Post-trip ratings between riders and drivers
- name: Notifications
  description: In-app notifications and issue reports
- name: Webhooks
  description: Inbound webhooks called by third-party services
