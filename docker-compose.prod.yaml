# Standalone (not merged with docker-compose.yaml) prod-like stack for
# testing the built image locally - no bind mount, runs the Dockerfile's
# real gunicorn CMD instead of the Flask dev server.
# Usage: docker compose -f docker-compose.prod.yaml up --build
services:
  backend:
    build: .
    container_name: wego_backend_prod
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DB_HOST=mysql_db
      - REDIS_HOST=redis
    depends_on:
      mysql_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  mysql_db:
    image: mysql:8.0
    container_name: wego_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: wego_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data_prod:
